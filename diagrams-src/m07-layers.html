<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>m07-layers · Diagram Design</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f6f5f1; color: #1d1d1b; padding: 2rem; font-family: 'Noto Sans Thai', 'Sarabun', 'Segoe UI', system-ui, sans-serif; }
    .frame { max-width: 760px; margin: 0 auto; }
    svg { width: 100%; min-width: 600px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 640 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m07-layers-title m07-layers-desc" font-family="'Noto Sans Thai','Sarabun','Segoe UI',system-ui,sans-serif">
      <title id="m07-layers-title">Lambda layer: แยกไลบรารีไว้ตรงกลาง</title>
      <desc id="m07-layers-desc">เปรียบเทียบก่อนและหลังใช้ Lambda layer: ก่อนใช้ ทุก function แพ็กไลบรารีซ้ำจน .zip ใหญ่ หลังใช้ function เหลือแต่โค้ดและอ้างอิงไลบรารีจาก layer ที่กองไว้ตรงกลาง ตัวเลขขนาดเป็นตัวอย่างประกอบ</desc>
      <defs>
        <marker id="m07-layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5f5d57"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f6f5f1"/>

      <!-- zones -->
      <rect x="40" y="72" width="272" height="264" rx="8" fill="rgba(29,29,27,0.02)" stroke="rgba(29,29,27,0.10)" stroke-width="0.8"/>
      <rect x="48" y="76" width="176" height="16" rx="2" fill="#f6f5f1"/>
      <text x="56" y="88" fill="#5f5d57" font-size="12" font-weight="600">ก่อน: ไลบรารีซ้ำทุกตัว</text>
      <rect x="328" y="72" width="272" height="264" rx="8" fill="rgba(29,29,27,0.02)" stroke="rgba(29,29,27,0.10)" stroke-width="0.8"/>
      <rect x="336" y="76" width="148" height="16" rx="2" fill="#f6f5f1"/>
      <text x="344" y="88" fill="#5f5d57" font-size="12" font-weight="600">หลัง: แชร์ผ่าน Layer</text>

      <!-- connectors: functions reference the layer -->
      <path d="M402,168 V192 Q402,200 410,200 H416 Q424,200 424,208 V248" fill="none" stroke="#5f5d57" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#m07-layers-arrow)"/>
      <path d="M526,168 V192 Q526,200 518,200 H504 Q496,200 496,208 V248" fill="none" stroke="#5f5d57" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#m07-layers-arrow)"/>

      <!-- before: every function carries the libraries -->
      <rect x="60" y="128" width="232" height="64" rx="6" fill="#f6f5f1"/>
      <rect x="60" y="128" width="232" height="64" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1"/>
      <text x="176" y="156" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Function A · .zip 50 MB</text>
      <text x="176" y="174" fill="#5f5d57" font-size="12" text-anchor="middle">โค้ด 1 MB + ไลบรารี 49 MB</text>
      <rect x="60" y="224" width="232" height="64" rx="6" fill="#f6f5f1"/>
      <rect x="60" y="224" width="232" height="64" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1"/>
      <text x="176" y="252" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Function B · .zip 50 MB</text>
      <text x="176" y="270" fill="#5f5d57" font-size="12" text-anchor="middle">โค้ด 1 MB + ไลบรารีชุดเดิมอีก 49 MB</text>

      <!-- after: tiny functions + one shared layer -->
      <rect x="348" y="112" width="108" height="56" rx="6" fill="#f6f5f1"/>
      <rect x="348" y="112" width="108" height="56" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1"/>
      <text x="402" y="136" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Function A</text>
      <text x="402" y="154" fill="#5f5d57" font-size="12" text-anchor="middle">.zip 1 MB</text>
      <rect x="472" y="112" width="108" height="56" rx="6" fill="#f6f5f1"/>
      <rect x="472" y="112" width="108" height="56" rx="6" fill="#ffffff" stroke="#1d1d1b" stroke-width="1"/>
      <text x="526" y="136" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Function B</text>
      <text x="526" y="154" fill="#5f5d57" font-size="12" text-anchor="middle">.zip 1 MB</text>
      <rect x="372" y="248" width="176" height="64" rx="6" fill="#f6f5f1"/>
      <rect x="372" y="248" width="176" height="64" rx="6" fill="rgba(180,83,9,0.10)" stroke="#b45309" stroke-width="1"/>
      <text x="460" y="276" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Lambda Layer</text>
      <text x="460" y="294" fill="#5f5d57" font-size="12" text-anchor="middle">ไลบรารีทั้งหมด 49 MB</text>

      <!-- legend -->
      <line x1="40" y1="356" x2="600" y2="356" stroke="rgba(29,29,27,0.10)" stroke-width="0.8"/>
      <line x1="48" y1="376" x2="84" y2="376" stroke="#5f5d57" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="96" y="380" fill="#5f5d57" font-size="12">เส้นประ = function อ้างอิงไลบรารีจาก Layer (ขนาด MB เป็นตัวอย่างประกอบ)</text>
    </svg>
  </div>
</body>
</html>
