<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>m07-version-before · Diagram Design</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f6f5f1; color: #1d1d1b; padding: 2rem; font-family: 'Google Sans', 'Noto Sans Thai Looped', 'Sarabun', 'Segoe UI', system-ui, sans-serif; }
    .frame { max-width: 700px; margin: 0 auto; }
    svg { width: 100%; min-width: 560px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m07-version-before-title m07-version-before-desc" font-family="'Google Sans','Noto Sans Thai Looped','Sarabun','Segoe UI',system-ui,sans-serif">
      <title id="m07-version-before-title">Version และ alias: ก่อนย้าย PROD</title>
      <desc id="m07-version-before-desc">เส้นเวลาของ Lambda: Version 1 และ Version 2 เรียงบนเส้นเดียวกัน ตามด้วย $LATEST ที่เป็นฉบับร่าง alias PROD ชี้ไป Version 1 สำหรับลูกค้าจริง และ alias TEST ชี้ไป Version 2 สำหรับทีมทดสอบ</desc>
      <defs>
        <marker id="m07-version-before-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5f5d57"/></marker>
        <marker id="m07-version-before-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b45309"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f6f5f1"/>

      <!-- time rail: old on the left, new on the right -->
      <path d="M48,248 H548" fill="none" stroke="#5f5d57" stroke-width="1.5" marker-end="url(#m07-version-before-arrow)"/>

      <!-- alias pointers -->
      <path d="M120,120 V234" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#m07-version-before-arrow-accent)"/>
      <path d="M300,120 V234" fill="none" stroke="#5f5d57" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#m07-version-before-arrow)"/>

      <!-- alias tags -->
      <rect x="52" y="88" width="136" height="32" rx="16" fill="#f6f5f1"/>
      <rect x="52" y="88" width="136" height="32" rx="16" fill="rgba(180,83,9,0.10)" stroke="#b45309" stroke-width="1"/>
      <text x="120" y="108" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">PROD · ลูกค้าจริง</text>
      <rect x="232" y="88" width="136" height="32" rx="16" fill="#f6f5f1"/>
      <rect x="232" y="88" width="136" height="32" rx="16" fill="#ffffff" stroke="#1d1d1b" stroke-width="1"/>
      <text x="300" y="108" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">TEST · ทีมทดสอบ</text>

      <!-- versions on the rail -->
      <circle cx="120" cy="248" r="14" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/>
      <circle cx="300" cy="248" r="14" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1"/>
      <circle cx="480" cy="248" r="14" fill="#f6f5f1" stroke="#1d1d1b" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="120" y="288" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Version 1</text>
      <text x="120" y="306" fill="#5f5d57" font-size="12" text-anchor="middle">แก้ไม่ได้</text>
      <text x="300" y="288" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Version 2</text>
      <text x="300" y="306" fill="#5f5d57" font-size="12" text-anchor="middle">แก้ไม่ได้</text>
      <text x="480" y="288" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">$LATEST</text>
      <text x="480" y="306" fill="#5f5d57" font-size="12" text-anchor="middle">ฉบับร่าง · นักพัฒนาแก้ที่นี่</text>

      <!-- legend -->
      <line x1="40" y1="328" x2="560" y2="328" stroke="rgba(29,29,27,0.10)" stroke-width="0.8"/>
      <rect x="48" y="340" width="28" height="16" rx="8" fill="rgba(180,83,9,0.10)" stroke="#b45309" stroke-width="1"/>
      <text x="84" y="352" fill="#5f5d57" font-size="12">Alias = ป้ายชี้</text>
      <circle cx="216" cy="348" r="6" fill="#1d1d1b"/>
      <text x="228" y="352" fill="#5f5d57" font-size="12">Version = snapshot</text>
      <circle cx="380" cy="348" r="6" fill="#f6f5f1" stroke="#1d1d1b" stroke-width="1.2" stroke-dasharray="3,2"/>
      <text x="392" y="352" fill="#5f5d57" font-size="12">$LATEST = ฉบับร่าง</text>
    </svg>
  </div>
</body>
</html>
