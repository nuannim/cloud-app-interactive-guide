<!DOCTYPE html>

  <style>

<body>

      <title id="m09-miss-penalty-title">Cache miss penalty</title>
      <desc id="m09-miss-penalty-desc">ถ้า cache hit ได้ข้อมูลทันที ถ้า miss หรือ TTL หมดอายุ application ต้องขอจาก database แล้วอัปเดต cache เวลาที่เสียเพิ่มคือ cache miss penalty</desc>
      <defs>

      </defs>
      <rect width="100%" height="100%" fill="#f6f5f1"/>
<text x="16" y="92" fill="#15803d" font-size="12" font-weight="600">Cache hit</text>

<rect x="290" y="64" width="92" height="44" rx="6" fill="rgba(180,83,9,0.10)" stroke="#b45309" stroke-width="1"/>
<text x="336" y="90" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">ElastiCache</text>
<path d="M220,86 L290,86" fill="none" stroke="#15803d" stroke-width="1.2" marker-end="url(#m09-miss-penalty-arrow-green)"/>
<rect x="452" y="64" width="252" height="44" rx="6" fill="#f6f5f1"/>
<rect x="452" y="64" width="252" height="44" rx="6" fill="rgba(21,128,61,0.10)" stroke="#15803d" stroke-width="1"/>

<path d="M382,86 L452,86" fill="none" stroke="#15803d" stroke-width="1.2" marker-end="url(#m09-miss-penalty-arrow-green)"/>
<text x="16" y="172" fill="#b91c1c" font-size="12" font-weight="600">Cache miss</text>

<rect x="290" y="144" width="92" height="44" rx="6" fill="rgba(180,83,9,0.10)" stroke="#b45309" stroke-width="1"/>

<rect x="452" y="144" width="92" height="44" rx="6" fill="#f6f5f1"/>
<rect x="452" y="144" width="92" height="44" rx="6" fill="rgba(29,29,27,0.05)" stroke="#5f5d57" stroke-width="1"/>
<text x="498" y="170" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Database</text>
<rect x="614" y="144" width="90" height="44" rx="6" fill="#f6f5f1"/>
<rect x="614" y="144" width="90" height="44" rx="6" fill="rgba(180,83,9,0.10)" stroke="#b45309" stroke-width="1"/>
<text x="659" y="170" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Update cache</text>

<path d="M382,166 L452,166" fill="none" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#m09-miss-penalty-arrow-red)"/>

<rect x="290" y="228" width="414" height="8" rx="4" fill="rgba(185,28,28,0.09)" stroke="#b91c1c" stroke-width="0.8"/>
<text x="497" y="258" fill="#b91c1c" font-size="12" font-weight="600" text-anchor="middle">เวลาที่เสียเพิ่ม = cache miss penalty</text>
<line x1="16" y1="282" x2="704" y2="282" stroke="rgba(29,29,27,0.10)" stroke-width="0.8"/>
<text x="16" y="302" fill="#5f5d57" font-size="12">เขียว = hit (เร็ว) · แดง = ขั้นที่ทำให้ช้า · ส้ม = ElastiCache และการอัปเดต cache</text>
<text x="16" y="320" fill="#5f5d57" font-size="12">เทียบเส้นทาง hit กับ miss: miss ต้องไปถึง database แล้วเขียนกลับ cache (ตามสไลด์ Cache miss penalty and TTL)</text>
