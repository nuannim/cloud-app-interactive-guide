<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>m09-what-is-cache · Diagram Design</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f6f5f1; color: #1d1d1b; padding: 2rem; font-family: 'Google Sans','Noto Sans Thai Looped','Sarabun','Segoe UI',system-ui,sans-serif; }
    .frame { max-width: 760px; margin: 0 auto; }
    svg { width: 100%; min-width: 600px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 720 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m09-what-is-cache-title m09-what-is-cache-desc" font-family="'Google Sans','Noto Sans Thai Looped','Sarabun','Segoe UI',system-ui,sans-serif">
      <title id="m09-what-is-cache-title">Cache ทำงานอย่างไร</title>
      <desc id="m09-what-is-cache-desc">Client ส่ง request ไปที่ cache ถ้ามีข้อมูลในสำเนา (hit) cache ตอบทันที ถ้าไม่มี (miss) cache ถาม origin แล้วเก็บสำเนาไว้พร้อม TTL ผลคือ latency ต่ำลงและ origin รับงานน้อยลง</desc>
      <defs>
        <marker id="m09-what-is-cache-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5f5d57"/></marker>
        <marker id="m09-what-is-cache-arrow-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b45309"/></marker>
        <marker id="m09-what-is-cache-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="m09-what-is-cache-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#15803d"/></marker>
        <marker id="m09-what-is-cache-arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b91c1c"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f6f5f1"/>
<rect x="16" y="120" width="120" height="56" rx="6" fill="#f6f5f1"/>
<rect x="16" y="120" width="120" height="56" rx="6" fill="rgba(46,90,168,0.10)" stroke="#2e5aa8" stroke-width="1"/>
<text x="76" y="143" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Client</text>
<text x="76" y="161" fill="#5f5d57" font-size="12" text-anchor="middle">ผู้ขอข้อมูล</text>
<rect x="300" y="120" width="120" height="56" rx="6" fill="#f6f5f1"/>
<rect x="300" y="120" width="120" height="56" rx="6" fill="rgba(180,83,9,0.10)" stroke="#b45309" stroke-width="1"/>
<text x="360" y="143" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">CACHE</text>
<text x="360" y="161" fill="#5f5d57" font-size="12" text-anchor="middle">สำเนา + TTL</text>
<rect x="584" y="120" width="120" height="56" rx="6" fill="#f6f5f1"/>
<rect x="584" y="120" width="120" height="56" rx="6" fill="rgba(29,29,27,0.05)" stroke="#5f5d57" stroke-width="1"/>
<text x="644" y="143" fill="#1d1d1b" font-size="12" font-weight="600" text-anchor="middle">Origin</text>
<text x="644" y="161" fill="#5f5d57" font-size="12" text-anchor="middle">ต้นทางของข้อมูล</text>
<path d="M136,134 L300,134" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#m09-what-is-cache-arrow-blue)"/>
<rect x="173" y="110" width="90" height="16" fill="#f6f5f1"/>
<text x="218" y="122" fill="#5f5d57" font-size="12" text-anchor="middle">1 · request</text>
<path d="M300,164 L136,164" fill="none" stroke="#15803d" stroke-width="1.2" marker-end="url(#m09-what-is-cache-arrow-green)"/>
<rect x="168" y="170" width="100" height="16" fill="#f6f5f1"/>
<text x="218" y="182" fill="#5f5d57" font-size="12" text-anchor="middle">hit: ตอบทันที</text>
<path d="M420,134 L584,134" fill="none" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#m09-what-is-cache-arrow-red)"/>
<rect x="446" y="110" width="112" height="16" fill="#f6f5f1"/>
<text x="502" y="122" fill="#5f5d57" font-size="12" text-anchor="middle">miss: ถามต้นทาง</text>
<path d="M584,164 L420,164" fill="none" stroke="#5f5d57" stroke-width="1.2" marker-end="url(#m09-what-is-cache-arrow)"/>
<rect x="437" y="170" width="130" height="16" fill="#f6f5f1"/>
<text x="502" y="182" fill="#5f5d57" font-size="12" text-anchor="middle">ส่งกลับ + เก็บสำเนา</text>
<rect x="120" y="232" width="220" height="44" rx="6" fill="#f6f5f1"/>
<rect x="120" y="232" width="220" height="44" rx="6" fill="rgba(21,128,61,0.10)" stroke="#15803d" stroke-width="1"/>
<text x="230" y="249" fill="#15803d" font-size="12" font-weight="600" text-anchor="middle">latency ต่ำลง</text>
<text x="230" y="267" fill="#5f5d57" font-size="12" text-anchor="middle">ผู้ขอได้คำตอบเร็วขึ้น</text>
<rect x="380" y="232" width="220" height="44" rx="6" fill="#f6f5f1"/>
<rect x="380" y="232" width="220" height="44" rx="6" fill="rgba(21,128,61,0.10)" stroke="#15803d" stroke-width="1"/>
<text x="490" y="249" fill="#15803d" font-size="12" font-weight="600" text-anchor="middle">origin รับงานน้อยลง</text>
<text x="490" y="267" fill="#5f5d57" font-size="12" text-anchor="middle">ไม่ต้องตอบทุก request</text>
<line x1="16" y1="300" x2="704" y2="300" stroke="rgba(29,29,27,0.10)" stroke-width="0.8"/>
<text x="16" y="320" fill="#5f5d57" font-size="12">เขียว = hit (เร็ว) · แดง = miss (ต้องไปถึง origin) · ส้ม = cache · น้ำเงิน = request ของผู้ขอ</text>
<text x="16" y="338" fill="#5f5d57" font-size="12">TTL = อายุของสำเนา เมื่อหมดอายุ ถือว่า miss แล้วต้องถามต้นทางใหม่</text>

    </svg>
  </div>
</body>
</html>
